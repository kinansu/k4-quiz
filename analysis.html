<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار التحليل الآلي - أبحاث الأطياف</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --bg-color: #ecf0f1;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--secondary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: left;
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .question-text {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1em;
            background: #fafafa;
        }

        .option:hover {
            border-color: var(--secondary-color);
            background: #ebf5fb;
        }

        .option.selected {
            background: var(--secondary-color);
            color: #fff;
            border-color: var(--secondary-color);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 10px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            transition: 0.3s;
        }

        .btn-next {
            background: var(--secondary-color);
            color: white;
        }

        .btn-next:hover {
            background: #2980b9;
        }

        .btn-prev {
            background: #95a5a6;
            color: white;
        }

        .btn-prev:hover {
            background: #7f8c8d;
        }

        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        /* Result Screen */
        .result-screen {
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--secondary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .review-list {
            margin-top: 30px;
        }

        .review-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-right: 5px solid #ccc;
        }

        .review-item.correct { border-right-color: var(--success-color); }
        .review-item.incorrect { border-right-color: var(--danger-color); }

        .review-q { font-weight: bold; margin-bottom: 10px; }
        .ans-correct { color: var(--success-color); font-weight: bold; }
        .ans-wrong { color: var(--danger-color); text-decoration: line-through; margin-left: 10px;}

    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <h1>اختبار أجهزة التحليل الآلي (الأطياف)</h1>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="progress-text" id="progress-text">السؤال 1 من 100</div>
        </div>

        <div class="question-text" id="question">جاري تحميل السؤال...</div>
        
        <div class="options-container" id="options">
            <!-- Options will be injected here -->
        </div>

        <div class="navigation">
            <button class="btn-prev" id="btn-prev" onclick="prevQuestion()" disabled>السابق</button>
            <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>التالي</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h1>النتيجة النهائية</h1>
        <div class="score-circle" id="score-display">0%</div>
        <h2 style="text-align: center;" id="score-msg"></h2>
        
        <div style="text-align: center; margin-bottom: 20px;">
            <button class="btn-next" onclick="location.reload()">إعادة الاختبار</button>
        </div>

        <h3 style="border-bottom: 2px solid #ccc; padding-bottom: 10px;">مراجعة الإجابات:</h3>
        <div class="review-list" id="review-list">
            <!-- Review items will be injected here -->
        </div>
    </div>
</div>

<script>
    // 100 Questions Data
    const quizData = [
        { q: "يُعرّف الضوء بأنه أحد أشكال الطاقة، وله طبيعتان هما:", opts: ["موجية وحرارية", "كمية ومغناطيسية", "موجية وكمية (جسيمية)", "حرارية وكهربائية"], ans: 2 },
        { q: "في الطبيعة الموجية للضوء، تُعرّف المسافة لدورة كاملة للموجة بـ:", opts: ["التواتر", "طول الموجة", "السعة", "العدد الموجي"], ans: 1 },
        { q: "في الطبيعة الكمية للضوء، تُدعى الدقائق التي تحمل طاقة محددة وتتحرك بسرعة الضوء بـ:", opts: ["الإلكترونات", "البروتونات", "الفوتونات", "النيوترونات"], ans: 2 },
        { q: "العلاقة التي تربط بين طاقة الفوتون (E) وتواتره (ν) حسب قانون بلانك هي:", opts: ["E = h / ν", "E = h × ν", "E = c × λ", "E = h × c"], ans: 1 },
        { q: "التناسب بين طاقة الإشعاع الممتصة (E) وطول الموجة (λ) هو:", opts: ["تناسب طردي", "تناسب عكسي", "لا يوجد تناسب", "تناسب أسي"], ans: 1 },
        { q: "يمتد مجال الطيف المرئي (Visible) تقريباً بين الأطوال الموجية:", opts: ["10 - 200 نانومتر", "200 - 400 نانومتر", "400 - 800 نانومتر", "800 - 2500 نانومتر"], ans: 2 },
        { q: "يمتد مجال الطيف ما فوق البنفسجي (UV) المستخدم في التحليل تقريباً بين:", opts: ["10 - 185 نانومتر", "185 - 400 نانومتر", "400 - 800 نانومتر", "800 - 2500 نانومتر"], ans: 1 },
        { q: "يحدث 'الاصطدام المرن' بين الإشعاع والمادة عندما:", opts: ["تكون طاقة الفوتون كافية لإحداث انتقال إلكتروني", "تمتص المادة كامل طاقة الفوتون", "تكون طاقة الفوتون الوارد غير كافية لإحداث تغير جذري في سويات الطاقة", "يحدث تفكك للروابط الكيميائية"], ans: 2 },
        { q: "في الاصطدام 'غير المرن' بين الإشعاع والمادة، طول موجة الضوء بعد الصدم يكون:", opts: ["أصغر من طول موجته قبل الصدم", "مساوياً لطول موجته قبل الصدم", "أكبر من طول موجته قبل الصدم", "مساوياً للصفر"], ans: 2 },
        { q: "الانتقالات التي تحتاج إلى أقل طاقة وتحدث في منطقة ما دون الحمراء البعيدة هي:", opts: ["الانتقالات الإلكترونية", "الانتقالات الاهتزازية", "الانتقالات الدورانية", "الانتقالات النووية"], ans: 2 },
        { q: "الترتيب الصحيح لسويات الطاقة من الأكبر إلى الأصغر طاقة هو:", opts: ["الدورانية > الاهتزازية > الإلكترونية", "الإلكترونية > الاهتزازية > الدورانية", "الاهتزازية > الإلكترونية > الدورانية", "الإلكترونية > الدورانية > الاهتزازية"], ans: 1 },
        { q: "الانتقالات الاهتزازية تحدث غالباً عند امتصاص المادة لأشعة في منطقة:", opts: ["الأشعة السينية", "الطيف المرئي", "ما فوق البنفسجي", "ما تحت الحمراء"], ans: 3 },
        { q: "البنى الحاوية على روابط أحادية تحتاج لكي تتهيج إلكتروناتها إلى طاقة:", opts: ["صغيرة جداً (طيف مرئي)", "كبيرة (مجال ما فوق البنفسجي البعيد)", "متوسطة (مجال تحت الأحمر)", "لا تتهيج إطلاقاً"], ans: 1 },
        { q: "المادة التي يظهر لونها للعين باللون 'الأصفر' تكون قد امتصت من الطيف المرئي اللون:", opts: ["الأصفر", "الأحمر", "الأزرق", "الأخضر"], ans: 2 },
        { q: "محلول برمنغنات البوتاسيوم ذو لون بنفسجي، بالتالي فإنه يمتص في المجال المرئي اللون:", opts: ["البنفسجي", "الأخضر المصفر", "الأزرق", "البرتقالي"], ans: 1 },
        { q: "تُعرّف 'النفوذية' (T) بأنها:", opts: ["لوغاريتم نسبة الضوء الوارد إلى النافذ", "نسبة الضوء النافذ إلى الضوء الوارد", "نسبة الضوء الوارد إلى الضوء النافذ", "جداء تركيز المادة بسماكة الخلية"], ans: 1 },
        { q: "العلاقة الرياضية التي تربط بين الامتصاصية (A) والنفوذية (T) هي:", opts: ["A = log(T)", "A = 1 / T", "A = -log(T)", "A = 2 + log(T)"], ans: 2 },
        { q: "إذا كانت النسبة المئوية للنفوذية (T%) تساوي 100%، فإن الامتصاصية (A) تساوي:", opts: ["1", "2", "0", "∞"], ans: 2 },
        { q: "عندما تكون الامتصاصية A = 2، فهذا يعني أن الكمية الممتصة من الإشعاع الوارد هي:", opts: ["10%", "50%", "90%", "99%"], ans: 3 },
        { q: "حسب قانون بير-لامبرت، التناسب بين الامتصاصية والتركيز هو:", opts: ["تناسب عكسي", "تناسب طردي خطي", "تناسب لوغاريتمي", "تناسب أسي"], ans: 1 },
        { q: "معامل الامتصاص الجزيئي يعتمد على:", opts: ["تركيز المادة فقط", "سماكة الخلية فقط", "طول الموجة ودرجة الحرارة ونوع المادة", "شدة الضوء الوارد"], ans: 2 },
        { q: "واحدة معامل الامتصاص الجزيئي (ε) إذا كان التركيز بالمول/لتر والسماكة بالسم هي:", opts: ["L/mol.cm", "mol/L.cm", "cm/mol", "ليس له واحدة"], ans: 0 },
        { q: "الانحراف عن الخطية في قانون بير-لامبرت يحدث غالباً في:", opts: ["المحاليل شديدة التمديد", "المحاليل مرتفعة التركيز", "عند استخدام طول الموجة الأعظمي", "عند استخدام خلايا الكوارتز"], ans: 1 },
        { q: "إذا أصدرت عينة نفوذية بمقدار 10%، فإن امتصاصيتها تساوي تقريباً:", opts: ["0.1", "0.5", "1.0", "2.0"], ans: 2 },
        { q: "عند رسم منحني المعايرة (الامتصاصية بدلالة التركيز)، يجب أن يمر الخط من:", opts: ["نقطة تقاطع المحورين (المبدأ)", "أعلى نقطة", "بين النقاط بشكل متوازن ولا يشترط مروره من المبدأ", "نقطة الامتصاصية الأعظمية"], ans: 2 },
        { q: "لتحديد التركيز الكمي باستخدام التحليل الطيفي، نفضل القياس عند:", opts: ["أطول طول موجة", "أقصر طول موجة", "طول موجة الامتصاص الأعظمي", "أي طول موجة"], ans: 2 },
        { q: "أي من المواد التالية ذات لون أصفر ولها قمة امتصاص أعظمية عند 444 nm؟", opts: ["برمنغنات البوتاسيوم", "فيتامين B2", "فيتامين B12", "ثنائي كرومات البوتاسيوم"], ans: 1 },
        { q: "يمكن تحديد شوارد الحديد الثلاثي غير الملونة في المجال المرئي عن طريق:", opts: ["قياسها مباشرة عند 250 nm", "تشكيل معقد أحمر مع شوارد الثيوسيانات", "أكسدتها ببزموتات الصوديوم", "تشكيل معقد مع الفينانترولين"], ans: 1 },
        { q: "من شروط إجراء التحليل الطيفي في المجال المرئي ألا يحدث فقدان للطاقة بسبب:", opts: ["الامتصاص", "الانعكاس أو الانكسار أو التشتت", "النفوذية", "الانتقالات الإلكترونية"], ans: 1 },
        { q: "عدد قمم الامتصاص في طيف الـ UV يعطي دلالة تقريبية على:", opts: ["تركيز المادة فقط", "عدد الروابط المضاعفة ونوعها", "درجة حرارة المحلول", "سماكة الخلية"], ans: 1 },
        { q: "مصدر الإضاءة الذي يعطي طيفاً مستمراً في المجال المرئي هو:", opts: ["مصباح الديتيريوم", "مصباح الهالوجين", "مصباح التنغستين", "مصباح المهبط المجوف"], ans: 2 },
        { q: "مصدر الإضاءة الأنسب للمجال ما فوق البنفسجي (UV) هو:", opts: ["مصباح التنغستين", "مصباح الديتيريوم", "ليزر الهيليوم", "مصباح الصوديوم"], ans: 1 },
        { q: "وظيفة 'موحد طول الموجة' (Monochromator) هي:", opts: ["تحويل الضوء لتيار", "اختيار طول موجة محدد من الإشعاع متعدد الأطوال", "احتواء العينة", "تكبير الإشارة"], ans: 1 },
        { q: "تعتمد 'فلاتر التداخل' في عملها على:", opts: ["امتصاص الألوان المتممة", "تداخل الضوء البناء والهدام", "تشتت الضوء", "الاستقطاب المغناطيسي"], ans: 1 },
        { q: "الموشور يقوم بتفكيك الحزمة الضوئية بناءً على اختلاف:", opts: ["شدة الإضاءة", "معامل الانكسار للأطوال الموجية المختلفة", "سماكة الزجاج", "طبيعة الكاشف"], ans: 1 },
        { q: "'المحزز' (Grating) يعتمد في فصل الأطوال الموجية على ظاهرة:", opts: ["الامتصاص", "الانعكاس والانعراج (Diffraction)", "النفوذية", "التبعثر"], ans: 1 },
        { q: "الخلية المستخدمة للقياس في المجال 'ما فوق البنفسجي' يجب أن تُصنع من:", opts: ["الزجاج العادي", "البلاستيك الشفاف", "الكوارتز (Quartz)", "الخشب"], ans: 2 },
        { q: "لماذا لا يمكن استخدام خلايا الزجاج العادي في مجال الـ UV؟", opts: ["لأنها هشة", "لأنها تتفاعل مع المحاليل", "لأنها تمتص الأشعة فوق البنفسجية", "لأنها غالية"], ans: 2 },
        { q: "من خصائص الكاشف المثالي في أجهزة الطيف:", opts: ["بطيء الاستجابة", "يتأثر بالحرارة", "استجابته ثابتة مع الزمن لنفس شدة الضوء", "يعطي تيار ظلام عالي"], ans: 2 },
        { q: "تيار الظلام (Dark Current) في الكواشف هو:", opts: ["التيار الناتج عند تسليط ضوء شديد", "الإشارة التي يعطيها الكاشف بدون سقوط أي شعاع ضوئي", "تيار تشغيل المصباح", "تيار التمديد"], ans: 1 },
        { q: "الخلية الكهروضوئية الحاجزة تتميز بأنها:", opts: ["تحتاج مصدر طاقة خارجي", "حساسة جداً للـ UV", "رخيصة ولا تحتاج لمصدر طاقة خارجي", "لا تعاني من الضعف"], ans: 2 },
        { q: "الأنبوب الضوئي المفرغ يعمل في:", opts: ["المجال المرئي فقط", "المجال فوق البنفسجي فقط", "المجالين المرئي وفوق البنفسجي", "مجال الأشعة تحت الحمراء"], ans: 2 },
        { q: "الكواشف متعددة القنوات (PDA) تتميز بـ:", opts: ["قياس طول موجة واحد فقط", "بطء شديد", "قياس جميع الأطوال الموجية في نفس الوقت", "رخص ثمنها"], ans: 2 },
        { q: "في جهاز التحليل 'ثنائي الحزمة' (Double Beam):", opts: ["يتم قياس الشاهد والعينة آلياً وفي نفس الوقت", "يتم إدخال خلية واحدة يدوياً", "لا يمكن مسح الطيف", "أرخص وأبسط من أحادي الحزمة"], ans: 0 },
        { q: "في تحليل مزيج من مادتين متداخلتين، يُفضل القياس عند:", opts: ["نقطة التقاطع", "طول موجة الامتصاص الأعظمي الثانية للمادة إذا كان التداخل عندها طفيفاً", "طول موجة لا تمتص عنده أي مادة", "أقل طول موجة"], ans: 1 },
        { q: "تعتمد مطيافية الأشعة تحت الحمراء (IR) على دراسة:", opts: ["الانتقالات الإلكترونية", "الانتقالات الاهتزازية والدورانية للجزيئات", "التفاعلات النووية", "تشتت الضوء"], ans: 1 },
        { q: "الشرط الأساسي لكي تمتص الرابطة أشعة IR هو:", opts: ["أن تكون غير قطبية تماماً", "أن تمتلك عزم ثنائي قطب يتغير أثناء الاهتزاز", "أن تكون متناظرة", "أن تحتوي معادن ثقيلة"], ans: 1 },
        { q: "الجزيئات المتناظرة مثل O2 و N2:", opts: ["تعطي طيف IR واضح", "تمتص في الـ IR القريب", "لا تمتص إشعاع IR لعدم وجود عزم ثنائي قطب", "تمتص في الـ UV فقط"], ans: 2 },
        { q: "أي أنماط الاهتزاز الطبيعية يحتاج لطاقة أكبر (تردد أكبر)؟", opts: ["اهتزاز الانحناء", "اهتزاز الامتطاط (Stretching)", "الاهتزاز الدوراني", "التأرجح"], ans: 1 },
        { q: "حسب قانون هوك، طاقة الاهتزاز تزداد بـ:", opts: ["نقصان قوة الرابطة وزيادة الكتلة", "زيادة قوة الرابطة ونقصان الكتلة المختزلة", "زيادة الكتلة فقط", "نقصان قوة الرابطة فقط"], ans: 1 },
        { q: "الترتيب الصحيح لتردد الامتصاص في IR حسب قوة الرابطة هو:", opts: ["أحادية > ثنائية > ثلاثية", "ثلاثية > ثنائية > أحادية", "ثنائية > ثلاثية > أحادية", "متساوية"], ans: 1 },
        { q: "منطقة 'بصمة الإصبع' في طيف الـ IR تقع تقريباً تحت التردد:", opts: ["3000 cm-1", "2500 cm-1", "1500 cm-1", "4000 cm-1"], ans: 2 },

        { q: "إذا كانت امتصاصية العياري 0.25 وتركيزه 1، وامتصاصية العينة 0.50، فإن تركيز العينة هو:", opts: ["0.5", "1.0", "2.0", "4.0"], ans: 2 },
        { q: "يُستخدم التحليل بالامتصاص الذري (AAS) في الدساتير الصيدلانية لـ:", opts: ["تحديد بنية البروتينات", "الكشف عن زمر الكربونيل", "تحديد الشوائب المعدنية (الرصاص، الزئبق) في الأدوية ومحاليل غسيل الكلية", "قياس الـ pH"], ans: 2 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const btnNext = document.getElementById('btn-next');
    const btnPrev = document.getElementById('btn-prev');
    const progressFill = document.getElementById('progress');
    const progressText = document.getElementById('progress-text');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');

    function loadQuestion() {
        const currentQuiz = quizData[currentQuestionIndex];
        questionEl.innerText = `${currentQuestionIndex + 1}. ${currentQuiz.q}`;
        
        optionsEl.innerHTML = '';
        currentQuiz.opts.forEach((opt, index) => {
            const div = document.createElement('div');
            div.className = `option ${userAnswers[currentQuestionIndex] === index ? 'selected' : ''}`;
            div.innerText = opt;
            div.onclick = () => selectOption(index);
            optionsEl.appendChild(div);
        });

        // Update Progress
        const percent = ((currentQuestionIndex + 1) / quizData.length) * 100;
        progressFill.style.width = `${percent}%`;
        progressText.innerText = `السؤال ${currentQuestionIndex + 1} من ${quizData.length}`;

        // Buttons state
        btnPrev.disabled = currentQuestionIndex === 0;
        
        if (userAnswers[currentQuestionIndex] !== null) {
            btnNext.disabled = false;
        } else {
            btnNext.disabled = true;
        }

        if (currentQuestionIndex === quizData.length - 1) {
            btnNext.innerText = "إنهاء الاختبار";
            btnNext.style.background = "#27ae60";
        } else {
            btnNext.innerText = "التالي";
            btnNext.style.background = "var(--secondary-color)";
        }
    }

    function selectOption(index) {
        userAnswers[currentQuestionIndex] = index;
        loadQuestion(); // reload to show selected state and enable next button
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            showResults();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';

        score = 0;
        const reviewList = document.getElementById('review-list');
        reviewList.innerHTML = '';

        quizData.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.ans;
            if (isCorrect) score++;

            const reviewItem = document.createElement('div');
            reviewItem.className = `review-item ${isCorrect ? 'correct' : 'incorrect'}`;
            
            let userAnswerText = userAnswers[i] !== null ? q.opts[userAnswers[i]] : "لم تتم الإجابة";
            let correctAnswerText = q.opts[q.ans];

            reviewItem.innerHTML = `
                <div class="review-q">${i + 1}. ${q.q}</div>
                <div>إجابتك: <span class="${isCorrect ? 'ans-correct' : 'ans-wrong'}">${userAnswerText}</span></div>
                ${!isCorrect ? `<div>الإجابة الصحيحة: <span class="ans-correct">${correctAnswerText}</span></div>` : ''}
            `;
            reviewList.appendChild(reviewItem);
        });

        const scoreDisplay = document.getElementById('score-display');
        const scoreMsg = document.getElementById('score-msg');
        
        const percentage = Math.round((score / quizData.length) * 100);
        scoreDisplay.innerText = `${percentage}%`;

        if (percentage >= 90) {
            scoreMsg.innerText = "ممتاز! مستوى رائع جداً.";
            scoreDisplay.style.background = "#27ae60";
        } else if (percentage >= 70) {
            scoreMsg.innerText = "جيد جداً! لقد أبليت بلاءً حسناً.";
            scoreDisplay.style.background = "#2980b9";
        } else if (percentage >= 50) {
            scoreMsg.innerText = "جيد، لكن يمكنك التحسن بمزيد من المراجعة.";
            scoreDisplay.style.background = "#f39c12";
        } else {
            scoreMsg.innerText = "تحتاج إلى إعادة دراسة المقرر بعناية.";
            scoreDisplay.style.background = "#e74c3c";
        }
    }

    // Initialize Quiz
    loadQuestion();
</script>
