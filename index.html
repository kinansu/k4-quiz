

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>K4 | بنك أسئلة أمراض الدم</title>
    <style>
        :root {
            --k4-deep: #0a0f1e;
            --k4-plate: #111827;
            --k4-card: #1a1f2e;
            --k4-gold: #d4a853;
            --k4-gold-light: #f0d078;
            --k4-accent: #3b82f6;
            --k4-accent-glow: rgba(59, 130, 246, 0.35);
            --k4-correct: #10b981;
            --k4-correct-bg: rgba(16, 185, 129, 0.12);
            --k4-wrong: #ef4444;
            --k4-wrong-bg: rgba(239, 68, 68, 0.12);
            --k4-text: #e2e8f0;
            --k4-text-muted: #94a3b8;
            --k4-border: #1e293b;
            --k4-radius: 18px;
            --k4-radius-sm: 12px;
            --k4-transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --k4-shadow: 0 4px 32px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', 'Cairo', sans-serif;
            background: var(--k4-deep);
            background-image: radial-gradient(ellipse at 50% 0%, rgba(212, 168, 83, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            color: var(--k4-text);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .k4-brand-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 6px 0;
        }

        .k4-logo {
            position: relative;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }

        .k4-logo .k4-geo {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1f2e 0%, #111827 100%);
            border: 2.5px solid var(--k4-gold);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 22px rgba(212, 168, 83, 0.25), 0 0 0 4px rgba(212, 168, 83, 0.06);
            transform: rotate(45deg);
            transition: var(--k4-transition);
        }

        .k4-logo .k4-geo span {
            transform: rotate(-45deg);
            font-weight: 900;
            font-size: 21px;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #f0d078 0%, #d4a853 40%, #b8943a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .k4-logo::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 18px;
            border: 1px solid rgba(212, 168, 83, 0.35);
            transform: rotate(45deg);
            pointer-events: none;
            animation: k4-pulse-ring 2.8s ease-in-out infinite;
        }

        @keyframes k4-pulse-ring {
            0%,
            100% {
                border-color: rgba(212, 168, 83, 0.25);
                inset: -4px;
            }
            50% {
                border-color: rgba(212, 168, 83, 0.6);
                inset: -7px;
            }
        }

        .k4-brand-text {
            font-weight: 800;
            font-size: 19px;
            letter-spacing: 0.5px;
            color: #e2e8f0;
        }
        .k4-brand-text .k4-dot {
            color: var(--k4-gold);
        }
        .k4-brand-sub {
            font-size: 10px;
            color: var(--k4-text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: -2px;
        }

        .quiz-card {
            background: var(--k4-card);
            border: 1px solid var(--k4-border);
            border-radius: var(--k4-radius);
            box-shadow: var(--k4-shadow);
            padding: 22px 18px 18px;
            position: relative;
            overflow: hidden;
        }

        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--k4-gold), var(--k4-accent), var(--k4-gold-light));
            border-radius: 0 0 4px 4px;
            opacity: 0.8;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .progress-bar-outer {
            flex: 1;
            height: 6px;
            background: var(--k4-border);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--k4-gold), var(--k4-accent));
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--k4-accent-glow);
        }
        .progress-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--k4-text-muted);
            white-space: nowrap;
            min-width: 44px;
            text-align: left;
        }

        .question-number {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--k4-gold);
            background: rgba(212, 168, 83, 0.08);
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(212, 168, 83, 0.2);
        }

        .question-text {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 18px;
            color: #f1f5f9;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 14px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 14px;
            background: var(--k4-plate);
            border: 1.5px solid var(--k4-border);
            border-radius: var(--k4-radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            transition: all 0.25s ease;
            font-family: inherit;
            text-align: right;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn:active {
            transform: scale(0.975);
            transition: transform 0.1s ease;
        }

        .option-btn:hover:not(.disabled) {
            border-color: rgba(212, 168, 83, 0.5);
            background: #1c2335;
            box-shadow: 0 0 20px rgba(212, 168, 83, 0.08);
        }

        .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--k4-border);
            font-weight: 800;
            font-size: 13px;
            color: #94a3b8;
            flex-shrink: 0;
            transition: var(--k4-transition);
        }

        .option-btn.selected {
            border-color: var(--k4-accent) !important;
            background: rgba(59, 130, 246, 0.1) !important;
            box-shadow: 0 0 20px var(--k4-accent-glow);
            color: #f1f5f9;
        }
        .option-btn.selected .option-letter {
            background: var(--k4-accent);
            color: #fff;
            box-shadow: 0 0 14px var(--k4-accent-glow);
        }

        .option-btn.correct-reveal {
            border-color: var(--k4-correct) !important;
            background: var(--k4-correct-bg) !important;
            color: #d1fae5;
            animation: pulse-green 0.5s ease;
        }
        .option-btn.correct-reveal .option-letter {
            background: var(--k4-correct);
            color: #fff;
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.5);
        }

        .option-btn.wrong-reveal {
            border-color: var(--k4-wrong) !important;
            background: var(--k4-wrong-bg) !important;
            color: #fecaca;
            animation: shake 0.4s ease;
        }
        .option-btn.wrong-reveal .option-letter {
            background: var(--k4-wrong);
            color: #fff;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.5);
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .option-btn.disabled.correct-reveal,
        .option-btn.disabled.wrong-reveal {
            opacity: 1;
        }

        @keyframes pulse-green {
            0%,
            100% {
                box-shadow: 0 0 0 rgba(16, 185, 129, 0);
            }
            50% {
                box-shadow: 0 0 24px rgba(16, 185, 129, 0.45);
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }

        .hint-area {
            background: rgba(212, 168, 83, 0.05);
            border: 1px dashed rgba(212, 168, 83, 0.3);
            border-radius: var(--k4-radius-sm);
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s ease;
            pointer-events: none;
        }
        .hint-area.visible {
            opacity: 1;
            max-height: 200px;
            pointer-events: auto;
            margin-bottom: 12px;
        }
        .hint-icon {
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .hint-text {
            font-size: 13px;
            color: #d4a853;
            line-height: 1.5;
            font-weight: 500;
        }

        .explanation-area {
            background: rgba(59, 130, 246, 0.06);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: var(--k4-radius-sm);
            padding: 14px 16px;
            margin-top: 6px;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s ease;
            pointer-events: none;
        }
        .explanation-area.visible {
            opacity: 1;
            max-height: 400px;
            pointer-events: auto;
            margin-top: 12px;
        }
        .explanation-label {
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--k4-accent);
            margin-bottom: 6px;
        }
        .explanation-text {
            font-size: 13px;
            color: #bcc9dc;
            line-height: 1.6;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: var(--k4-transition);
            letter-spacing: 0.3px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.94);
            transition: transform 0.1s ease;
        }

        .btn-hint {
            background: transparent;
            border: 1.5px solid rgba(212, 168, 83, 0.5);
            color: #d4a853;
            flex: 1;
            min-width: 70px;
        }
        .btn-hint:hover {
            background: rgba(212, 168, 83, 0.08);
            border-color: #d4a853;
        }
        .btn-hint:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .btn-next {
            background: linear-gradient(135deg, var(--k4-accent), #2563eb);
            color: #fff;
            flex: 2;
            min-width: 110px;
            box-shadow: 0 4px 18px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-next:hover {
            box-shadow: 0 6px 24px rgba(59, 130, 246, 0.45);
            background: linear-gradient(135deg, #4b8df8, #3068e0);
        }
        .btn-next:disabled {
            opacity: 0.4;
            pointer-events: none;
            box-shadow: none;
        }

        .btn-restart {
            background: transparent;
            border: 1.5px solid var(--k4-border);
            color: #94a3b8;
            flex: 1;
            min-width: 100px;
        }
        .btn-restart:hover {
            border-color: #94a3b8;
            color: #e2e8f0;
        }

        .result-screen {
            text-align: center;
            padding: 30px 16px;
        }
        .result-emoji {
            font-size: 60px;
            margin-bottom: 12px;
            animation: bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounce-in {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            60% {
                transform: scale(1.08);
                opacity: 1;
            }
            100% {
                transform: scale(1);
            }
        }
        .result-score {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #f0d078, #d4a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .result-label {
            font-size: 14px;
            color: var(--k4-text-muted);
            margin-bottom: 20px;
        }
        .result-msg {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 18px;
        }

        .k4-footer {
            text-align: center;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(148, 163, 184, 0.5);
            padding: 4px 0;
        }
        .k4-footer span {
            color: var(--k4-gold);
            font-weight: 700;
        }

        @media (max-width: 380px) {
            .quiz-card {
                padding: 16px 12px 14px;
            }
            .question-text {
                font-size: 15px;
            }
            .option-btn {
                padding: 12px 10px;
                font-size: 13px;
                gap: 8px;
            }
            .option-letter {
                width: 30px;
                height: 30px;
                font-size: 12px;
                border-radius: 8px;
            }
            .btn {
                padding: 10px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="k4-brand-bar">
            <div class="k4-logo"><div class="k4-geo"><span>K4</span></div></div>
            <div>
                <div class="k4-brand-text">K<span class="k4-dot">4</span> QUIZ</div>
                <div class="k4-brand-sub">أمراض الدم · 30 سؤال</div>
            </div>
        </div>
        <div id="quizRoot"></div>
        <div class="k4-footer">منصة <span>K4</span> · تعلّم بذكاء</div>
    </div>

    <script>
        (function() {
            const questionBank = [{
                id: 1,
                question: 'إذا خضع مريض مصاب بورم خبيث لمعالجة شعاعية تستهدف الخلايا سريعة الانقسام، فلماذا تنجو الخلايا الجذعية المكونة للدم (Stem cells) من هذا التأثير المدمر؟',
                options: [
                    { letter: 'أ', text: 'لأنها خلايا متمايزة تفرز مركبات واقية تمنع الإشعاع.' },
                    { letter: 'ب',
                        text: 'لتواجدها في مرحلة الراحة G0 في الدورة الخلوية مما يجعلها مقاومة للمركبات الكيميائية والشعاعية.' },
                    { letter: 'ج', text: 'لأنها تهاجر فوراً إلى الغدد اللمفاوية المحيطية عند استشعار الخطر الشعاعي.' },
                    { letter: 'د', text: 'لأنها تمتلك مخزوناً هائلاً من الترومبوبويتين الذي يحيد الجزيئات الحرة.' },
                ],
                correctIndex: 1,
                hint: 'ابحث عن الحالة التي تمر بها هذه الخلايا في دورتها الخلوية وتأثيرها على استقرارها جينياً.',
                explanation: 'صحيح علمياً؛ وجود الخلايا الجذعية في مرحلة الراحة G0 يحميها من العلاجات التي تستهدف الأطوار النشطة للانقسام الخلوي في الحالات السرطانية.',
            }, {
                id: 2,
                question: 'أثناء التطور الجنيني البشري، أين يتركز تشكل خلايا الدم (Hematopoiesis) في الشهر السادس من الحمل؟',
                options: [
                    { letter: 'أ', text: 'الحويصل المحي بشكل رئيسي وجدران الأبهر.' },
                    { letter: 'ب', text: 'الكبد والطحال.' },
                    { letter: 'ج', text: 'نقي العظام الطويلة مثل عظم الفخذ والظنبوب حصراً.' },
                    { letter: 'د', text: 'الغدة الزعترية (التوتة).' },
                ],
                correctIndex: 1,
                hint: 'تذكر تسلسل أعضاء نشوء الدم جينياً قبل أن ينفرد نقي العظم بالعملية بعد الولادة.',
                explanation: 'صحيح؛ في الشهر السادس من المرحلة الجنينية يمثل الكبد والطحال المراكز الرئيسية لتشكل خلايا الدم.',
            }, {
                id: 3,
                question: 'ما الذي يحدث لقدرات التجدد الذاتي (Self-renewal) والتمايز (Differentiation) عندما تتحول الخلايا الجذعية إلى أرومات نقوية ولمفاوية؟',
                options: [
                    { letter: 'أ', text: 'تزداد القدرة على التجدد الذاتي وتتراجع القدرة على التمايز.' },
                    { letter: 'ب', text: 'تتحسن كلتا القدرتين بشكل متوازٍ لضمان غزارة الإنتاج.' },
                    { letter: 'ج',
                        text: 'تفقد الخلايا قدرتها على التجدد الذاتي بينما تكتسب قدرة أكبر على التمايز.' },
                    { letter: 'د', text: 'تفقد الخلايا القدرتين معاً وتتحول فوراً إلى خلايا هرمة.' },
                ],
                correctIndex: 2,
                hint: 'العلاقة عكسية بين نضوج الخلية وتخصصها وقدرتها على استنساخ نفسها بشكل أبدي.',
                explanation: 'صحيح؛ في هذه المرحلة تفقد الخلايا قدرتها على التجدد الذاتي في حين تكتسب قدرة أكبر على التمايز.',
            }, {
                id: 4,
                question: 'في سياق تنظيم تشكل الدم بنقي العظم، ما هو الدور الأساسي الذي تلعبه البالعات الكبيرة (Macrophages) المتواجدة في منطقة السدى؟',
                options: [
                    { letter: 'أ', text: 'إفراز الهيبارين لمنع حدوث التخثر داخل الجيوب الشعرية.' },
                    { letter: 'ب', text: 'التمايز إلى خلايا شحمية لملء الفراغات المتبقية بعد النضوج الخلوي.' },
                    { letter: 'ج',
                        text: 'ابتلاع المخلفات الخلوية الناتجة أثناء عملية تشكل الدم وتنظيم التمايز والنضج الخلوي.' },
                    { letter: 'د', text: 'تشكيل الجيوب الشعرية التي تعبر من خلالها الخلايا الناضجة.' },
                ],
                correctIndex: 2,
                hint: 'دورها مزدوج يرتبط بنظافة البيئة النخاعية وتوجيه الخلايا الناشئة.',
                explanation: 'صحيح؛ تتخصص البالعات الكبيرة في ابتلاع المخلفات الخلوية الناتجة أثناء تشكل الدم، كما تقوم بتنظيم التمايز والنضج الخلوي.',
            }, {
                id: 5,
                question: 'مريض يعاني من قصور كلوي مزمن متقدم، ظهر لديه فقر دم شديد مع انخفاض ملحوظ في توليد الكريات الحمراء. ما هو العامل المنظم الأساسي المسبب لهذه الحالة؟',
                options: [
                    { letter: 'أ', text: 'نقص إنتاج عامل تحفيز الخلايا المحببة (CSF-G).' },
                    { letter: 'ب', text: 'نقص إفراز الإريتروبويتين (Erythropoietin).' },
                    { letter: 'ج', text: 'فرط نشاط خلايا السدى النخاعية وإفراز الكولاجين.' },
                    { letter: 'د', text: 'ارتفاع مستويات الترومبوبويتين الكبدي.' },
                ],
                correctIndex: 1,
                hint: 'تذكر الغليكوبروتين الذي يتم إنتاجه بشكل رئيسي في الكليتين.',
                explanation: 'صحيح؛ الإريتروبويتين هو المسؤول عن تكون الكريات الحمراء، ويتم إنتاجه من قبل الكليتين (والكبد)، وقصور الكلية يمنع إنتاجه.',
            }, {
                id: 6,
                question: 'أثناء دراسة نضوج الكريات الحمراء، في أي مرحلة يتوقف تماماً اصطناع الهيموغلوبين (الخضاب الدموي) داخل الخلية؟',

                hint: 'في هذه الحالة يغيب اصطناع سلاسل بيتا كلياً أو ينقص بشدة، مما يمنع تشكل الخضاب البالغ الطبيعي.',
                explanation: 'صحيح؛ في التلاسيميا بيتا الكبرى يغيب الخضاب البالغ HbA، ويسيطر الخضاب الجنيني HbF بنسب عالية لتعويض النقص.',
            }, {
                id: 27,
                question: 'في متلازمة الخضاب الجنيني (Hb Barts) الناجمة عن غياب الجينات الأربعة لسلاسل ألفا (--/--)، ما هو التركيب الجزيئي لخضاب بارت الذي يسبب الوفاة الجنينية؟',
                options: [
                    { letter: 'أ', text: 'أربع سلاسل بيتا (4β).' },
                    { letter: 'ب', text: 'أربع سلاسل غاما (4γ).' },
                    { letter: 'ج', text: 'سلسلتان ألفا وسلسلتان غاما (2α 2γ).' },
                    { letter: 'د', text: 'سلسلتان دلتا وسلسلتان غاما (2δ 2γ).' },
                ],
                correctIndex: 1,
                hint: 'تتجمع السلاسل الفائضة المتاحة في الجنين لتشكيل خضاب شاذ ذي ألفة شديدة للأوكسجين.',
                explanation: 'صحيح؛ خضاب بارت يتكون من 4 سلاسل غاما، ويتميز بألفة شديدة للأوكسجين لا يتخلى عنه للأنسجة، مما يسبب وفاة الجنين.',
            }, {
                id: 28,
                question: 'مريض لديه عوز إنزيم G6PD (التفول)، تعرض لنوبة انحلال حادة بعد تناول مضادات الملاريا. ما هي الآلية الممرضة الدقيقة لحدوث الانحلال في هذه الحالة؟',
                options: [
                    { letter: 'أ', text: 'نقص طاقة ATP مما يعطل مضخة الصوديوم وتنفجر الكرية.' },
                    { letter: 'ب',
                        text: 'انخفاض NADPH يؤدي لعجز الغلوتاثيون المرجع عن حماية الكرية من العوامل المؤكسدة.' },
                    { letter: 'ج', text: 'زيادة إنتاج 2,3-DPG مما يفقد الغشاء مرونته.' },
                    { letter: 'د', text: 'تدمير الغشاء بواسطة أضداد ذاتية مناعية.' },
                ],
                correctIndex: 1,
                hint: 'الإنزيم يحمي الكرية من الشوارد المؤكسدة عبر الحفاظ على مستويات مركب محدد.',
                explanation: 'صحيح؛ نقص G6PD يقلل NADPH الضروري لعمل مرجعة الغلوتاثيون، فتتعرض سلاسل الغلوبين للأكسدة وتتشكل أجسام هاينز وتخرب الكرية.',
            }, {
                id: 29,
                question: 'ما هي الموجودات الوصفية المميزة في اللطاخة المحيطية لمريض يعاني من نوبة انحلال حادة بسبب عوز إنزيم G6PD؟',
                options: [
                    { letter: 'أ', text: 'خلايا هدفية (Target cells) وخلايا دمعية.' },
                    { letter: 'ب', text: 'أجسام هاينز (Heinz bodies) وخلايا معضوضة (Bite cells).' },
                    { letter: 'ج', text: 'أجسام هاول-جولي وكريات حمراء منواة.' },
                    { letter: 'د', text: 'خلايا كروية (Spherocytes) مع إيجابية اختبار كومبس.' },
                ],
                correctIndex: 1,
                hint: 'الأكسدة تسبب ترسب الخضاب في الخلية، وتقوم البالعات في الطحال بقضم هذا الترسب.',
                explanation: 'صحيح؛ أجسام هاينز هي خضاب مترسب مؤكسد، والخلايا المعضوضة تنتج عن قضم الطحال لهذه الأجسام.',
            }, {
                id: 30,
                question: 'في "احمرار الدم البدئي" (Polycythemia Vera)، أي من العبارات التالية تصف الآلية المرضية والموجودات بشكل صحيح؟',
                options: [
                    { letter: 'أ', text: 'تكاثر عشوائي مقتصر حصراً على الكريات الحمراء، مع غياب ضخامة الطحال.' },
                    { letter: 'ب', text: 'مرض يصيب الشباب غالباً بسبب نقص الأكسجة المزمن في المرتفعات.' },
                    { letter: 'ج',
                        text: 'مرض يصادف بعد الخمسين، يتميز بتكاثر عشوائي يشمل السلالة الحمراء والمحببة واللمفاوية مع ضخامة طحال وكبد.' },
                    { letter: 'د', text: 'ينتج عن فرط إفراز هرمون الإريتروبويتين من أورام الكلية.' },
                ],
                correctIndex: 2,
                hint: 'هو مرض تكاثري نقوي شامل لا يقتصر على الكريات الحمراء فقط، ويترافق مع ضخامة عضو معين.',
                explanation: 'صحيح؛ احمرار الدم البدئي هو داء تكاثري نقوي يتميز بتكاثر الخلايا الحمراء والمحببة واللمفاوية ويترافق مع ضخامة كبد وطحال وأعراض فرط اللزوجة.',
            }];

            let currentQuestionIndex = 0;
            let score = 0;
            let answered = false;
            let hintUsed = false;
            let selectedOptionIndex = null;
            let quizFinished = false;
            const quizRoot = document.getElementById('quizRoot');

            function renderQuiz() {
                if (quizFinished) {
                    renderResultScreen();
                    return;
                }
                const q = questionBank[currentQuestionIndex];
                const total = questionBank.length;
                const progressPercent = Math.round((currentQuestionIndex / total) * 100);

                let optionsHTML = '';
                q.options.forEach((opt, idx) => {
                    let btnClass = '';
                    if (answered) {
                        if (idx === q.correctIndex) btnClass = 'correct-reveal disabled';
                        else if (idx === selectedOptionIndex && idx !== q.correctIndex) btnClass =
                            'wrong-reveal disabled';
                        else btnClass = 'disabled';
                    } else if (idx === selectedOptionIndex) btnClass = 'selected';
                    optionsHTML += `<li><button class="option-btn ${btnClass}" data-index="${idx}" ${answered ? 'disabled' : ''}><span class="option-letter">${opt.letter}</span><span>${opt.text}</span></button></li>`;
                });

                const hintVisible = hintUsed && !answered;
                const explanationVisible = answered;
                const html = `
            <div class="quiz-card">
              <div class="progress-wrap"><div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${progressPercent}%;"></div></div><span class="progress-label">${currentQuestionIndex + 1}/${total}</span></div>
              <span class="question-number">✦ سؤال ${q.id}</span>
              <p class="question-text">${q.question}</p>
              <ul class="options-list">${optionsHTML}</ul>
              <div class="hint-area ${hintVisible ? 'visible' : ''}"><span class="hint-icon">💡</span><span class="hint-text">${q.hint}</span></div>
              <div class="explanation-area ${explanationVisible ? 'visible' : ''}"><div class="explanation-label">📖 شرح الإجابة</div><p class="explanation-text">${q.explanation}</p></div>
              <div class="controls-row">
                <button class="btn btn-hint" id="btnHint" ${answered || hintUsed ? 'disabled' : ''}>💡 تلميح</button>
                ${answered ? (currentQuestionIndex < total - 1 ? '<button class="btn btn-next" id="btnNext">التالي ←</button>' : '<button class="btn btn-next" id="btnFinish">عرض النتيجة 🏆</button>') : '<button class="btn btn-next" id="btnCheck" disabled>✓ تحقق من الإجابة</button>'}
              </div>
            </div>`;
                quizRoot.innerHTML = html;
                bindEvents(q, total);
            }

            function bindEvents(q, total) {
                document.querySelectorAll('.option-btn:not(.disabled)').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (answered) return;
                        selectedOptionIndex = parseInt(this.getAttribute('data-index'));
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove(
                            'selected'));
                        this.classList.add('selected');
                        const btnCheck = document.getElementById('btnCheck');
                        if (btnCheck) btnCheck.disabled = false;
                    });
                });
                const btnHint = document.getElementById('btnHint');
                if (btnHint) btnHint.addEventListener('click', () => { hintUsed = true;
                    renderQuiz(); });
                const btnCheck = document.getElementById('btnCheck');
                if (btnCheck) btnCheck.addEventListener('click', () => {
                    if (selectedOptionIndex === null) return;
                    answered = true;
                    if (selectedOptionIndex === q.correctIndex) score++;
                    renderQuiz();
                });
                const btnNext = document.getElementById('btnNext');
                if (btnNext) btnNext.addEventListener('click', () => goToNextQuestion(total));
                const btnFinish = document.getElementById('btnFinish');
                if (btnFinish) btnFinish.addEventListener('click', () => {
                    if (selectedOptionIndex === q.correctIndex && !answered) score++;
                    answered = true;
                    quizFinished = true;
                    renderQuiz();
                });
            }

            function goToNextQuestion(total) {
                if (currentQuestionIndex < total - 1) {
                    currentQuestionIndex++;
                    answered = false;
                    hintUsed = false;
                    selectedOptionIndex = null;
                    renderQuiz();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    quizRoot.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            function renderResultScreen() {
                const total = questionBank.length;
                const percent = Math.round((score / total) * 100);
                let emoji, msg;
                if (percent >= 90) { emoji = '🏆';
                    msg = 'أداء استثنائي! أنت خبير في أمراض الدم.'; } else if (percent >= 70) { emoji = '🌟';
                    msg = 'أداء رائع! واصل التقدم.'; } else if (percent >= 50) { emoji = '👍';
                    msg = 'جيد جداً، مع المراجعة ستصل للقمة.'; } else { emoji = '📚';
                    msg = 'لا بأس، رحلة التعلم مستمرة. حاول مجدداً!'; }
                quizRoot.innerHTML = `
            <div class="quiz-card result-screen">
              <div class="result-emoji">${emoji}</div>
              <div class="result-score">${score} / ${total}</div>
              <div class="result-label">${percent}%</div>
              <p class="result-msg">${msg}</p>
              <div class="controls-row" style="justify-content:center;"><button class="btn btn-restart" id="btnRestart">🔄 إعادة الاختبار</button></div>
            </div>`;
                document.getElementById('btnRestart').addEventListener('click', () => {
                    currentQuestionIndex = 0;
                    score = 0;
                    answered = false;
                    hintUsed = false;
                    selectedOptionIndex = null;
                    quizFinished = false;
                    renderQuiz();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            function init() { renderQuiz(); }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();

            window.K4Quiz = {
                loadQuestionBank: function(newBank) {
                    if (Array.isArray(newBank) && newBank.length > 0) {
                        const valid = newBank.every(q => q.question && Array.isArray(q.options) && q
                            .options.length >= 2 && typeof q.correctIndex === 'number' && q
                            .correctIndex >= 0 && q.correctIndex < q.options.length && q.options.every(
                                o => o.letter && o.text));
                        if (valid) {
                            questionBank.length = 0;
                            questionBank.push(...newBank);
                            currentQuestionIndex = 0;
                            score = 0;
                            answered = false;
                            hintUsed = false;
                            selectedOptionIndex = null;
                            quizFinished = false;
                            renderQuiz();
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                            console.log('✅ K4: تم تحميل بنك الأسئلة بنجاح (' + newBank.length +
                                ' سؤال)');
                            return true;
                        } else { console.error(
                                '❌ K4: بنك الأسئلة غير صالح. تأكد من احتوائه على: question, options (مع letter و text), correctIndex.'
                                ); return false; }
                    }
                    console.error('❌ K4: يجب أن يكون بنك الأسئلة مصفوفة غير فارغة.');
                    return false;
                },
                reset: function() {
                    currentQuestionIndex = 0;
                    score = 0;
                    answered = false;
                    hintUsed = false;
                    selectedOptionIndex = null;
                    quizFinished = false;
                    renderQuiz();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },
            };
            console.log('%c🩸 K4 أمراض الدم %cجاهز | %c' + questionBank.length + ' سؤالاً',
                'color:#d4a853;font-weight:bold;font-size:16px;', 'color:#94a3b8;',
                'color:#3b82f6;font-weight:bold;');
        })();
    </script>
</body>
</html>
